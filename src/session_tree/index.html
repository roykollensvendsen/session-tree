<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Session Tree</title>
<style>
  :root{
    --bg:#0e1116; --panel:#151a22; --panel2:#1b212b; --line:#252d3a;
    --ink:#e6edf6; --dim:#8b97a8; --faint:#5b6678;
    --pending:#49556a; --active:#3b82f6; --done:#22c55e;
    --stall:#eab308; --block:#ef4444; --gone:#3a4150;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    background:var(--bg); color:var(--ink);
    font:13px/1.45 ui-sans-serif,-apple-system,"Segoe UI",Roboto,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  header{
    position:sticky; top:0; z-index:20; display:flex; align-items:center; gap:14px;
    padding:10px 16px; background:rgba(14,17,22,.94); backdrop-filter:blur(8px);
    border-bottom:1px solid var(--line);
  }
  h1{font-size:13px;font-weight:600;margin:0;letter-spacing:.3px}
  .live{display:flex;align-items:center;gap:6px;color:var(--dim);font-size:11px}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--done);
       box-shadow:0 0 0 0 rgba(34,197,94,.6); animation:beat 2s infinite}
  .dot.off{background:var(--block);animation:none}
  @keyframes beat{0%{box-shadow:0 0 0 0 rgba(34,197,94,.5)}70%{box-shadow:0 0 0 7px rgba(34,197,94,0)}100%{box-shadow:0 0 0 0 rgba(34,197,94,0)}}
  .spacer{flex:1}
  .key{display:flex;gap:11px;flex-wrap:wrap;font-size:10.5px;color:var(--dim)}
  .key i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:4px;vertical-align:-1px}
  main{padding:14px 16px 60px}

  .sess{background:var(--panel);border:1px solid var(--line);border-radius:10px;margin-bottom:12px;overflow:hidden}
  .sess.idle{opacity:.58}
  .sess.idle .shead{background:transparent}
  .shead{display:flex;align-items:center;gap:9px;padding:9px 13px;cursor:pointer;
         background:linear-gradient(90deg,rgba(59,130,246,.09),transparent)}
  .shead:hover{background:rgba(255,255,255,.035)}
  .pill{font-size:10px;padding:1.5px 7px;border-radius:99px;border:1px solid var(--line);color:var(--dim);white-space:nowrap}
  .pill.on{color:#bfe3ff;border-color:rgba(59,130,246,.55);background:rgba(59,130,246,.14)}
  .pill.bg{color:#e8d6a8;border-color:rgba(234,179,8,.4);background:rgba(234,179,8,.1)}
  .sname{font-weight:600;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .spath{color:var(--faint);font-size:10.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
  .caret{color:var(--faint);transition:transform .15s;font-size:10px}
  .sess.closed .caret{transform:rotate(-90deg)}
  .sess.closed .sbody{display:none}
  .sbody{padding:4px 13px 13px}

  .now{display:flex;align-items:center;gap:7px;font-size:11.5px;color:#a8c7f0;
       padding:6px 10px;margin:2px 0 10px;border-left:2px solid var(--active);
       background:rgba(59,130,246,.07);border-radius:0 5px 5px 0}
  .now.stall{color:#f0dfa8;border-color:var(--stall);background:rgba(234,179,8,.07)}
  .now.none{color:var(--faint);border-color:var(--line);background:transparent}

  .goals{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-start}
  .goal{background:var(--panel2);border:1px solid var(--line);border-radius:8px;
        padding:9px 10px 6px;flex:1 1 330px;min-width:300px}
  .gtitle{font-size:11.5px;font-weight:600;color:#cbd6e6;margin-bottom:2px;
          white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:zoom-in}
  .gtitle:hover{color:#ffffff;text-decoration:underline dotted}
  /* one graph on its own: the card's graph, filling the window, zoomable */
  #focus{position:fixed;inset:0;background:var(--bg);z-index:50;display:none;flex-direction:column}
  #focus.on{display:flex}
  #focus .fhead{display:flex;align-items:center;gap:12px;padding:9px 14px;border-bottom:1px solid var(--line);background:var(--panel)}
  #focus .fhead b{font-size:13px;color:#cbd6e6;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #focus .fhint{font-size:10.5px;color:var(--faint);white-space:nowrap}
  #focus button{background:var(--panel2);border:1px solid var(--line);color:var(--ink);border-radius:6px;padding:3px 9px;font-size:11px;cursor:pointer}
  #focus .fbody{flex:1;overflow:hidden;cursor:grab;touch-action:none}
  #focus .fbody.dragging{cursor:grabbing}
  #focus .fbody svg{width:100%;height:100%;overflow:hidden}
  .gmeta{font-size:10px;color:var(--faint);margin-bottom:7px}
  .bar{height:3px;border-radius:2px;background:#222936;overflow:hidden;margin-bottom:8px}
  .bar b{display:block;height:100%;background:var(--done);transition:width .4s}

  svg{display:block;width:100%;overflow:visible}
  .node rect{transition:opacity .2s}
  .node text{pointer-events:none;font-size:10.5px;fill:var(--ink)}
  .node .id{font-size:9px;fill:var(--faint);font-weight:600}
  .node{cursor:default}
  .node.dim{opacity:.22}
  .edge{fill:none;stroke:#2f3947;stroke-width:1.3}
  .edge.lit{stroke:#7fb2ff;stroke-width:2}
  .edge.dim{opacity:.15}
  .bandlbl{font-size:9px;fill:var(--faint)}
  .bandline{stroke:#1f2732;stroke-width:1}
  .bandline.nowline{stroke:#3b82f6;stroke-dasharray:3 3;opacity:.5}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.45}}
  .pulsing{animation:pulse 1.6s ease-in-out infinite}

  .tip{position:fixed;z-index:60;max-width:390px;background:#0b0e13;color:var(--ink);
       border:1px solid #33404f;border-radius:8px;padding:9px 11px;font-size:11.5px;
       box-shadow:0 12px 34px rgba(0,0,0,.6);pointer-events:none;opacity:0;transition:opacity .1s;line-height:1.5;
       overflow:auto;overscroll-behavior:contain}
  .tip.on{opacity:1}
  /* opened by a finger: it takes the touch, so a swipe scrolls it and a tap,
     which leaves the node, closes it */
  .tip.on.touch{pointer-events:auto}
  .tip h4{margin:0 0 5px;font-size:12px}
  .tip p{margin:5px 0;color:#b9c4d4;white-space:pre-wrap}
  .tip .row{color:var(--dim);font-size:10.5px;margin-top:5px;border-top:1px solid #222b36;padding-top:5px}
  .rp{display:flex;align-items:center;gap:8px;padding:7px 10px;margin:2px 0 9px;
      background:rgba(147,112,219,.09);border-left:2px solid #9370db;border-radius:0 5px 5px 0}
  .rp button{background:#20283400;border:1px solid var(--line);color:var(--ink);
      border-radius:5px;padding:2px 8px;font-size:11px;cursor:pointer;line-height:1.6}
  .rp button:hover{background:#263041;border-color:#3d4a5c}
  .rp .t{font-variant-numeric:tabular-nums;color:#c9b6ef;font-size:11px;min-width:96px}
  .behind{background:#9370db;color:#160d24;border:none;border-radius:99px;padding:2px 9px;
      font-size:10.5px;font-weight:700;cursor:pointer;white-space:nowrap;animation:nudge 2s infinite}
  .behind:hover{background:#a98be6}
  @keyframes nudge{0%,100%{opacity:1}50%{opacity:.62}}
  .sess.frozen{box-shadow:inset 0 0 0 1px rgba(147,112,219,.5)}
  .sess.frozen .shead{background:linear-gradient(90deg,rgba(147,112,219,.16),transparent)}
  .rp input[type=range]{flex:1;accent-color:#9370db;height:3px;cursor:pointer;min-width:90px}
  .track{position:relative;height:11px;margin:-4px 0 6px}
  .track i{position:absolute;top:3px;width:2px;height:6px;border-radius:1px;opacity:.75}
  .evline{font-size:11px;color:#b9c4d4;padding:5px 10px 7px;margin:-6px 0 9px;
      border-left:2px solid #9370db;background:rgba(147,112,219,.05);border-radius:0 5px 5px 0}
  .evline b{color:#d9c9f5;font-weight:600}
  .evline .said{color:#a8e0c0}
  .evline .ghost{color:var(--faint);display:block;font-size:10.5px;margin-top:2px;
      overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .rbtn{background:none;border:1px solid var(--line);color:var(--dim);border-radius:5px;
      padding:1px 7px;font-size:10px;cursor:pointer;white-space:nowrap}
  .rbtn:hover{color:var(--ink);border-color:#3d4a5c}
  .rbtn.on{color:#d9c9f5;border-color:#9370db;background:rgba(147,112,219,.16)}
  .agent{font-size:9.5px;letter-spacing:.4px;text-transform:uppercase;padding:1.5px 6px;
      border-radius:99px;border:1px solid var(--line);color:var(--dim)}
  .agent.codex{color:#9fe0c8;border-color:rgba(72,199,158,.45);background:rgba(72,199,158,.11)}
  .agent.claude{color:#d3b9a0;border-color:rgba(214,150,99,.42);background:rgba(214,150,99,.1)}
  .turns{display:flex;gap:2px;align-items:stretch;height:26px;margin:2px 0 7px}
  .turns i{flex:1 1 auto;border-radius:3px;min-width:5px;cursor:default;transition:opacity .15s}
  .turns i:hover{filter:brightness(1.35)}
  .tn-completed{background:rgba(34,197,94,.55)}
  .tn-failed{background:rgba(239,68,68,.75)}
  .tn-interrupted{background:rgba(234,179,8,.6)}
  .tn-in_progress{background:rgba(59,130,246,.8);animation:pulse 1.6s ease-in-out infinite}
  .why{font-size:10.5px;color:var(--faint);font-style:italic;padding:2px 0 8px}
  .att{font-size:10px;padding:1.5px 7px;border-radius:99px;white-space:nowrap;font-weight:600}
  .att.waiting{color:#0e1116;background:#d8b4fe}
  .att.stalled{color:#0e1116;background:var(--stall);animation:nudge 2s infinite}
  .agentrow{font-size:10.5px;color:var(--dim);padding:5px 10px 7px;margin:0 0 8px;
      border-left:2px solid #6b7a90;background:rgba(255,255,255,.028);border-radius:0 5px 5px 0}
  .agentrow b{color:#cbd6e6;font-weight:600}
  .agentrow .run{color:#8fc7ff}
  .broken{font-size:10.5px;color:#f0c98a;background:rgba(234,179,8,.1);
      border-left:2px solid var(--stall);border-radius:0 4px 4px 0;padding:4px 8px;margin:0 0 7px}
  .empty{color:var(--faint);font-size:11px;padding:8px 2px;font-style:italic}
  /* several independent goals: one page at a time, with a pager */
  .pager{display:flex;align-items:center;gap:8px;margin:0 0 8px;font-size:11px;color:var(--dim);
      user-select:none;touch-action:pan-y}
  .pager button{background:var(--panel2);border:1px solid var(--line);color:var(--ink);border-radius:6px;
      padding:2px 10px;font-size:12px;cursor:pointer;line-height:1.6}
  .pager button:hover{border-color:#3d4a5c}
  .pager button.on{color:#d9c9f5;border-color:#9370db;background:rgba(147,112,219,.16)}
  .pager .dots{display:flex;gap:5px;align-items:center}
  .pager .dots i{width:8px;height:8px;border-radius:50%;background:var(--pending);cursor:pointer;display:block}
  .pager .dots i.on{background:#9370db}
  .pager .n{font-variant-numeric:tabular-nums;min-width:36px;text-align:center}
  .pager .ptitle{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#cbd6e6;font-weight:600}
  .goals.paged{touch-action:pan-y}
  /* a phone: one column, thumb-sized controls, nothing wider than the screen */
  @media (max-width:640px){
    header{padding:8px 16px;gap:8px;flex-wrap:wrap}
    .key{display:none}
    main{padding:12px 16px 40px}
    .sbody{padding:4px 10px 12px}
    .goal{flex:1 1 100%;min-width:0}
    .spath{display:none}
    .shead{min-height:44px}
    .rp{flex-wrap:wrap}
    .rp button,.rbtn,.pager button,#focus button,.behind{min-height:40px;min-width:40px;padding:6px 12px;font-size:13px}
    .pager .dots i{width:14px;height:14px}
    #focus .fhint{display:none}
    #focus .fhead b{font-size:12px}
  }
</style>
</head>
<body>
<header>
  <h1>Session Tree</h1>
  <span class="live"><span class="dot" id="dot"></span><span id="conn">kobler til…</span></span>
  <span class="spacer"></span>
  <span class="key">
    <span><i style="background:var(--active)"></i>jobber nå</span>
    <span><i style="background:var(--done)"></i>ferdig</span>
    <span><i style="background:var(--stall)"></i>står stille</span>
    <span><i style="background:var(--block)"></i>blokkert</span>
    <span><i style="background:var(--pending)"></i>venter</span>
    <span><i style="background:var(--gone)"></i>forkastet</span>
  </span>
</header>
<div id="focus"><div class="fhead"><b id="ftitle"></b><span class="fhint">hjul eller knip = zoom · dra = panorér · dobbeltklikk = tilpass · Esc = lukk</span><span style="flex:1"></span><button id="ffit">tilpass</button><button id="fclose">✕</button></div><div class="fbody" id="fbody"></div></div>
<main id="root"></main>
<div class="tip" id="tip"></div>

<script>
const COLOR={pending:'#49556a',waiting:'#49556a',in_progress:'#3b82f6',
             completed:'#22c55e',stalled:'#eab308',blocked:'#ef4444',abandoned:'#3a4150'};
const LABEL={pending:'venter',waiting:'venter på andre',in_progress:'jobber nå',
             failed:'feilet',interrupted:'avbrutt',
             completed:'ferdig',stalled:'står stille',blocked:'blokkert',abandoned:'forkastet'};

const PENDING=[];   // graphs waiting for their card to have a real width
const REPLAY=new Map();   // sessionId -> {t, playing, timer}
let LAST=null;            // last payload, so replay can re-render without the stream

const EVK={prompt:'du sa',create:'ny node','status:in_progress':'startet',
           files:'endret filer','command:failed':'kommando feilet',
           'turn:completed':'tur fullført','turn:failed':'tur feilet',
           'turn:interrupted':'tur avbrutt','turn:in_progress':'tur startet',
           'status:completed':'ferdig','status:pending':'satt på vent',
           'status:abandoned':'forkastet'};

/* The graph as it stood at time t: a node exists only once it was created, and
   wears the last status it had been given by then. The derived states are
   recomputed against that moment, never against now. */
function stateAt(sess,t){
  const quiet=(()=>{ let last=sess.spanStart;
    for(const e of sess.events||[]) if(e.at<=t) last=e.at; else break;
    return (t-last)/1000; })();
  const goals=[];
  for(const g of sess.goals){
    const nodes=[];
    for(const n of g.nodes){
      if(n.createdMs&&n.createdMs>t) continue;
      let st='pending';
      for(const h of n.history||[]) if(h.atMs!=null&&h.atMs<=t) st=h.status;
      nodes.push(Object.assign({},n,{status:st,view:st}));
    }
    if(nodes.length) goals.push(Object.assign({},g,{nodes:nodes}));
  }
  const open=new Set();
  goals.forEach(g=>g.nodes.forEach(n=>{ if(n.status==='pending'||n.status==='in_progress') open.add(n.id); }));
  goals.forEach(g=>g.nodes.forEach(n=>{
    const blocking=(n.blockedBy||[]).filter(d=>open.has(d));
    n.waitingOn=blocking;
    if(n.status==='in_progress'){
      if(blocking.length) n.view='blocked';
      else if(quiet>900) n.view='stalled';
    } else if(n.status==='pending'&&blocking.length) n.view='waiting';
    n.durationMs=(n.startedMs&&n.startedMs<=t)
      ? ((n.endedMs&&n.endedMs<=t)?n.endedMs-n.startedMs:t-n.startedMs) : null;
  }));
  return goals;
}

function evAt(sess,t){
  let cur=null;
  for(const e of sess.events||[]) if(e.at<=t) cur=e; else break;
  return cur;
}
function clock(ms){ const d=new Date(ms);
  return d.toLocaleTimeString('no-NO',{hour:'2-digit',minute:'2-digit',second:'2-digit'}); }
const tip=document.getElementById('tip');
const collapsed=new Set(JSON.parse(localStorage.getItem('st.collapsed')||'[]'));
const opened=new Set(JSON.parse(localStorage.getItem('st.opened')||'[]'));
/* Which goal a session's pager is on, and whether the viewer asked for all of
   them at once. Both are conveniences, so losing them costs nothing. */
const SWIPE_PX=40;                 // a horizontal move this long is a swipe, not a tap
let PAGE={}, pagerAll=false;
try{ PAGE=JSON.parse(localStorage.getItem('st.page')||'{}')||{}; pagerAll=localStorage.getItem('st.pagerAll')==='1'; }catch(e){ PAGE={}; }
function remember(key,value){ try{ localStorage.setItem(key,value); }catch(e){} }
function pageOf(sess,count){
  const i=PAGE[sess.sessionId]|0;
  return Math.min(Math.max(0,i),Math.max(0,count-1));
}
function turnPage(sessionId,delta,count){
  const i=(((PAGE[sessionId]|0)+delta)%count+count)%count;
  PAGE[sessionId]=i; remember('st.page',JSON.stringify(PAGE)); refresh();
}

function ago(s){ s=Math.max(0,Math.round(s));
  if(s<60)return s+'s'; if(s<3600)return Math.round(s/60)+' min';
  if(s<86400)return (s/3600).toFixed(1)+' t'; return Math.round(s/86400)+' d'; }
function dur(ms){ return ms==null?'':ago(ms/1000); }
function esc(s){ return (s||'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }

/* The part of the page actually on the screen. A pinched phone shows only a
   piece of the layout, and a popover placed against the whole layout lands
   where nobody can see it. Coordinates are the ones clientX and a fixed
   element's left share. */
const TIP_MARGIN=8, TIP_GAP=12, TIP_MAX_W=390, TIP_MIN_H=80;
function visibleArea(){
  const v=window.visualViewport;
  return v?{x:v.offsetLeft,y:v.offsetTop,w:v.width,h:v.height}:{x:0,y:0,w:innerWidth,h:innerHeight};
}
/* Where a w x h popover goes next to the anchor a (a node's box, or the bare
   pointer as a box of no size): below it, else above, else beside it, and in
   every case clamped so that all of it is inside the visible area vp. When no
   side has room it takes the larger of below and above and is cut to that
   height, to scroll inside: covering the node would put the tap that opened
   it on the popover instead, which reads as leaving the node and closes it. */
function placeTip(a,w,h,vp){
  const left=vp.x+TIP_MARGIN, top=vp.y+TIP_MARGIN;
  const right=vp.x+vp.w-TIP_MARGIN, bottom=vp.y+vp.h-TIP_MARGIN;
  const clampX=x=>Math.max(left,Math.min(x,right-w));
  const clampY=y=>Math.max(top,Math.min(y,bottom-h));
  const alongX=()=>clampX(a.left+w<=right?a.left:a.right-w);
  const below=bottom-a.bottom-TIP_GAP, above=a.top-TIP_GAP-top;
  if(h<=below) return {x:alongX(),y:a.bottom+TIP_GAP,h:h};
  if(h<=above) return {x:alongX(),y:a.top-TIP_GAP-h,h:h};
  if(a.right+TIP_GAP+w<=right) return {x:a.right+TIP_GAP,y:clampY(a.top),h:h};
  if(a.left-TIP_GAP-w>=left) return {x:a.left-TIP_GAP-w,y:clampY(a.top),h:h};
  const cut=Math.min(h,Math.max(below,above,TIP_MIN_H));
  const y=below>=above?a.bottom+TIP_GAP:a.top-TIP_GAP-cut;
  return {x:alongX(),y:Math.max(top,Math.min(y,bottom-cut)),h:cut};
}
/* A finger hides what it taps and gives no pointer to follow, so a tapped node
   anchors the popover by its box; a mouse anchors it at the pointer. */
let TOUCH=false;
document.addEventListener('pointerdown',e=>{ TOUCH=e.pointerType!=='mouse'; },{capture:true,passive:true});
document.addEventListener('pointermove',e=>{ if(e.pointerType==='mouse') TOUCH=false; },{capture:true,passive:true});
function showTip(e,html,anchor){
  const vp=visibleArea();
  tip.innerHTML=html; tip.scrollTop=0;
  tip.classList.toggle('touch',TOUCH); tip.classList.add('on');
  // measured at the top-left corner, so its old place cannot squeeze its width
  tip.style.left=vp.x+TIP_MARGIN+'px'; tip.style.top=vp.y+TIP_MARGIN+'px';
  tip.style.maxWidth=Math.min(TIP_MAX_W,vp.w-2*TIP_MARGIN)+'px';
  tip.style.maxHeight=(vp.h-2*TIP_MARGIN)+'px';
  const r=tip.getBoundingClientRect();
  const a=TOUCH&&anchor?anchor.getBoundingClientRect()
    :{left:e.clientX,right:e.clientX,top:e.clientY,bottom:e.clientY};
  const at=placeTip(a,r.width,r.height,vp);
  tip.style.left=at.x+'px'; tip.style.top=at.y+'px'; tip.style.maxHeight=at.h+'px';
}
const hideTip=()=>tip.classList.remove('on');
// a popover a finger opened belongs to where the page was; moving it closes it
const dropTouchTip=()=>{ if(TOUCH&&tip.classList.contains('on')){ hideTip(); POINTER=null; } };
addEventListener('scroll',dropTouchTip,{passive:true});
if(window.visualViewport) visualViewport.addEventListener('resize',dropTouchTip);

/* A live session redraws the whole graph each time its transcript grows, which
   replaces the node under a resting pointer with one that has seen no pointer
   event: its wires went dark until the mouse moved. So the page keeps where the
   pointer is, and after every redraw hands the node now under it the same event
   again -- the highlight and the popover come back with the fresh data. */
let POINTER=null;
document.addEventListener('mousemove',e=>{ POINTER={x:e.clientX,y:e.clientY}; },{passive:true});
document.documentElement.addEventListener('mouseleave',()=>{ POINTER=null; });
function rehover(){
  if(!POINTER) return;
  const hit=document.elementFromPoint(POINTER.x,POINTER.y);
  const node=hit&&hit.closest('.node');
  if(node) node.dispatchEvent(new MouseEvent('mousemove',{clientX:POINTER.x,clientY:POINTER.y,bubbles:true}));
  else hideTip();
}

/* How big a graph is drawn. A card has a card's width, so its nodes are small
   and a subject gets one clipped line. The focused graph has as much room as it
   wants, since it pans, so its nodes are wide enough to read on a phone at full
   size, and a subject gets up to three lines. Sizes are in the drawing's own
   units, which are CSS pixels when the focus is at full size. */
const SIZE={
  card:{nodeW:190,minW:300,grow:false,pad:7,idFont:9,font:10.5,lines:1,lineH:11,idTop:12,textTop:23,
        agentH:12,agentFont:9,padBottom:7,bandGap:22,colGap:8},
  large:{nodeW:250,minW:0,grow:true,pad:10,idFont:11.5,font:14,lines:3,lineH:18,idTop:16,textTop:34,
         agentH:17,agentFont:11.5,padBottom:10,bandGap:40,colGap:18},
};
const FONT='ui-sans-serif,-apple-system,"Segoe UI",Roboto,sans-serif';
const measure=document.createElement('canvas').getContext('2d');
/* A subject broken into at most `lines` lines no wider than `width` at this
   font size; whatever does not fit ends the last line with an ellipsis. */
function wrapLines(text,width,px,lines){
  measure.font=px+'px '+FONT;
  const fits=t=>measure.measureText(t).width<=width;
  const clip=t=>{ while(t&&!fits(t+'…')) t=t.slice(0,-1); return t.trimEnd()+'…'; };
  const out=[]; let line='';
  for(const word of (text||'').split(/\s+/).filter(Boolean)){
    const next=line?line+' '+word:word;
    if(fits(next)){ line=next; continue; }
    if(line&&out.length<lines-1){ out.push(line); line=word; if(fits(word)) continue; }
    else line=next;
    // the last line is full, or one word is wider than a line
    return out.concat(clip(line));
  }
  return line?out.concat(line):out;
}

/* Bands are the order the work has to happen in, not a clock: a node sits in
   the first band where every dependency above it is already done. */
function layout(goal,width,size){
  const nodes=goal.nodes, depth=goal.depth||{};
  const bands=new Map();
  nodes.forEach(n=>{ const d=depth[n.id]||0; if(!bands.has(d))bands.set(d,[]); bands.get(d).push(n); });
  const ds=[...bands.keys()].sort((a,b)=>a-b);
  // the widest band decides the width when the size asks for more than is given
  const widest=Math.max(1,...[...bands.values()].map(r=>r.length));
  const W=Math.max(size.minW,width||330,size.grow?widest*(size.nodeW+size.colGap):0);
  const pos={}, lines={};
  // a subject takes the lines it needs, and subagents add a row each
  const heightOf=n=>size.textTop+(lines[n.id].length-1)*size.lineH+size.padBottom
    +((n.agents||[]).length?(n.agents.length*size.agentH+4):0);
  let y=16;
  const bandTop=[];
  ds.forEach((d,bi)=>{
    const row=bands.get(d);
    bandTop[bi]=y;
    // pull each node toward the average x of what it depends on, so the wires
    // cross as little as possible without a real layered layout
    row.forEach(n=>{
      const ups=(n.blockedBy||[]).map(i=>pos[i]).filter(Boolean);
      n._h=ups.length?ups.reduce((a,p)=>a+p.cx,0)/ups.length:W/2;
    });
    row.sort((a,b)=>a._h-b._h);
    // a card spreads a band across its width; a graph that grew to its widest
    // band packs the others around the middle, so they stay near each other
    const gap=size.grow?size.nodeW+size.colGap:W/row.length, w=Math.min(gap-size.colGap,size.nodeW);
    const left=(W-gap*row.length)/2;
    row.forEach(n=>{ lines[n.id]=wrapLines(n.subject,w-2*size.pad,size.font,size.lines); });
    const tallest=Math.max(...row.map(heightOf));
    row.forEach((n,i)=>{
      const cx=left+gap*i+gap/2, h=heightOf(n);
      pos[n.id]={x:cx-w/2,y:y,w:w,h:h,cx:cx,cy:y+h/2,band:bi,lines:lines[n.id]};
    });
    y+=tallest+size.bandGap;
  });
  return {pos,bands:ds,bandTop,height:y+6,W};
}

function renderGoal(goal,sess,width,size){
  const L=layout(goal,width,size), NS='http://www.w3.org/2000/svg';
  const svg=document.createElementNS(NS,'svg');
  svg.setAttribute('viewBox',`0 0 ${L.W} ${L.height}`);
  svg.setAttribute('height',L.height);

  const live=goal.nodes.filter(n=>n.view!=='abandoned');
  const firstOpen=live.find(n=>n.view!=='completed');
  const nowBand=firstOpen?L.pos[firstOpen.id].band:-1;

  L.bands.forEach((d,bi)=>{
    const y=(L.bandTop[bi]||16)-14;
    const ln=document.createElementNS(NS,'line');
    ln.setAttribute('x1',0);ln.setAttribute('x2',L.W);ln.setAttribute('y1',y);ln.setAttribute('y2',y);
    ln.setAttribute('class','bandline'+(bi===nowBand?' nowline':''));
    svg.appendChild(ln);
    if(bi===nowBand){
      const t=document.createElementNS(NS,'text');
      t.setAttribute('x',1);t.setAttribute('y',y+11);t.setAttribute('class','bandlbl');
      t.style.fill='#5e8fd0'; t.style.fontSize=size.idFont+'px'; t.textContent='nå';
      svg.appendChild(t);
    }
  });

  goal.nodes.forEach(n=>{
    (n.blockedBy||[]).forEach(dep=>{
      const a=L.pos[dep], b=L.pos[n.id];
      if(!a||!b) return;
      const p=document.createElementNS(NS,'path');
      const my=(a.cy+a.h/2+b.y)/2;
      p.setAttribute('d',`M${a.cx},${a.y+a.h} C${a.cx},${my} ${b.cx},${my} ${b.cx},${b.y}`);
      p.setAttribute('class','edge');
      p.dataset.from=dep; p.dataset.to=n.id;
      svg.appendChild(p);
    });
  });

  goal.nodes.forEach(n=>{
    const p=L.pos[n.id]; if(!p) return;
    const g=document.createElementNS(NS,'g');
    g.setAttribute('class','node'); g.dataset.id=n.id;

    const r=document.createElementNS(NS,'rect');
    r.setAttribute('x',p.x);r.setAttribute('y',p.y);r.setAttribute('width',p.w);r.setAttribute('height',p.h);
    r.setAttribute('rx',6);
    const c=COLOR[n.view]||COLOR.pending;
    r.setAttribute('fill',n.view==='completed'?'rgba(34,197,94,.14)':
                          n.view==='in_progress'?'rgba(59,130,246,.2)':
                          n.view==='blocked'?'rgba(239,68,68,.14)':
                          n.view==='stalled'?'rgba(234,179,8,.13)':'rgba(255,255,255,.035)');
    r.setAttribute('stroke',c);
    r.setAttribute('stroke-width',n.view==='in_progress'?2:1.2);
    if(n.view==='abandoned') r.setAttribute('stroke-dasharray','3 3');
    if(n.view==='in_progress') g.classList.add('pulsing');
    g.appendChild(r);

    const small=(x,y,text,px)=>{
      const t=document.createElementNS(NS,'text');
      t.setAttribute('x',x);t.setAttribute('y',y);t.setAttribute('class','id');
      t.style.fontSize=px+'px'; t.textContent=text;
      g.appendChild(t); return t;
    };
    small(p.x+size.pad,p.y+size.idTop,'#'+n.id,size.idFont);

    const label=document.createElementNS(NS,'text');
    label.style.fontSize=size.font+'px';
    p.lines.forEach((line,li)=>{
      const span=document.createElementNS(NS,'tspan');
      span.setAttribute('x',p.x+size.pad);span.setAttribute('y',p.y+size.textTop+li*size.lineH);
      span.textContent=line; label.appendChild(span);
    });
    if(n.view==='abandoned'){label.style.fill='#5b6678';label.style.textDecoration='line-through';}
    if(n.view==='completed')label.style.fill='#b7e6c6';
    g.appendChild(label);

    const agentTop=p.y+size.textTop+(p.lines.length-1)*size.lineH+size.padBottom;
    (n.agents||[]).forEach((a,ai)=>{
      const ay=agentTop+ai*size.agentH, mid=ay+size.agentFont*0.4;
      const dot=document.createElementNS(NS,'circle');
      dot.setAttribute('cx',p.x+size.pad+4);dot.setAttribute('cy',mid);dot.setAttribute('r',size.agentFont/3);
      dot.setAttribute('fill',a.running?'#3b82f6':'#22c55e');
      if(a.running) dot.setAttribute('class','pulsing');
      g.appendChild(dot);
      const room=p.w-2*size.pad-12;
      const lbl=small(p.x+size.pad+12,mid+size.agentFont*0.36,
        wrapLines(a.description||'agent',room,size.agentFont,1)[0]||'',size.agentFont);
      lbl.style.fill=a.running?'#9ec8f5':'#8b97a8';
    });
    if((n.failures||[]).length) small(p.x+p.w-2*size.idFont-6,p.y+size.idTop+1,'!',size.idFont).style.fill='#ef8a8a';
    if(n.view==='completed') small(p.x+p.w-size.idFont-4,p.y+size.idTop+1,'✓',size.idFont).style.fill='#22c55e';

    g.addEventListener('mousemove',e=>{
      const waiting=(n.waitingOn||[]).length?
        `<div class="row">venter på #${n.waitingOn.join(', #')}</div>`:'';
      const time=n.durationMs!=null?
        `<div class="row">${n.status==='in_progress'?'holdt på i ':'tok '}${dur(n.durationMs)}</div>`:'';
      // what actually came out of the node, not just that it went green
      const files=(n.files||[]).length?
        `<div class="row">rørte ${esc([...new Set(n.files)].slice(0,8).join(', '))}${n.files.length>8?' …':''}</div>`:'';
      const bad=(n.failures||[]).length?
        `<div class="row" style="color:#f0a8a8">${n.failures.length} kommando${n.failures.length>1?'er':''} feilet · ${esc(n.failures[0])}</div>`:'';
      showTip(e,`<h4>#${n.id} · ${esc(n.subject)}</h4>
        <div style="color:${COLOR[n.view]};font-size:11px;font-weight:600">${LABEL[n.view]||n.view}</div>
        ${n.description?`<p>${esc(n.description)}</p>`:''}${waiting}${time}${files}${bad}
        <div class="row">${esc(sess.project)}${sess.branch?' · '+esc(sess.branch):''}</div>`,r);
      svg.querySelectorAll('.node').forEach(o=>o.classList.toggle('dim',o.dataset.id!==n.id &&
        !(n.blockedBy||[]).includes(o.dataset.id) && !(n.blocks||[]).includes(o.dataset.id)));
      svg.querySelectorAll('.edge').forEach(o=>{
        const lit=o.dataset.from===n.id||o.dataset.to===n.id;
        o.classList.toggle('lit',lit); o.classList.toggle('dim',!lit);
      });
    });
    g.addEventListener('mouseleave',()=>{
      hideTip();
      svg.querySelectorAll('.node').forEach(o=>o.classList.remove('dim'));
      svg.querySelectorAll('.edge').forEach(o=>{o.classList.remove('lit');o.classList.remove('dim');});
    });
    svg.appendChild(g);
  });
  return svg;
}

function stopPlay(id){
  const r=REPLAY.get(id);
  if(r&&r.timer){ clearInterval(r.timer); r.timer=null; r.playing=false; }
}

function replayPanel(s,rp){
  const box=document.createElement('div');
  const a=s.spanStart, b=s.spanEnd||s.spanStart+1, span=Math.max(1,b-a);
  const ev=evAt(s,rp.t);
  // the stream keeps arriving while this session is frozen; say so, or the
  // viewer reads a still picture as a stalled one
  const behind=(s.events||[]).filter(e=>e.at>rp.t).length;

  const bar=document.createElement('div');
  bar.className='rp';
  bar.innerHTML=`<button title="forrige hendelse">⏮</button>
    <button title="${rp.playing?'pause':'spill av'}">${rp.playing?'⏸':'▶'}</button>
    <button title="neste hendelse">⏭</button>
    <input type="range" min="${a}" max="${b}" value="${rp.t}" step="1000">
    <span class="t">${clock(rp.t)}</span>
    ${behind?`<button class="behind" title="hopp til nå">${behind} nye ↦</button>`:''}
    <button title="tilbake til live">live ⏏</button>`;
  const kids=[...bar.children];
  const liveBtn=kids[kids.length-1];
  const behindBtn=bar.querySelector('.behind');
  const [prev,play,next,slider]=kids;
  if(behindBtn) behindBtn.onclick=()=>{ stopPlay(s.sessionId); REPLAY.delete(s.sessionId); refresh(); };

  const jump=dir=>{
    stopPlay(s.sessionId);
    const list=s.events||[];
    const target=dir>0 ? list.find(e=>e.at>rp.t) : [...list].reverse().find(e=>e.at<rp.t);
    rp.t=target?target.at:(dir>0?b:a); refresh();
  };
  prev.onclick=()=>jump(-1);
  next.onclick=()=>jump(1);
  slider.oninput=e=>{ stopPlay(s.sessionId); rp.t=+e.target.value; refresh(); };
  liveBtn.onclick=()=>{ stopPlay(s.sessionId); REPLAY.delete(s.sessionId); refresh(); };
  play.onclick=()=>{
    if(rp.playing){ stopPlay(s.sessionId); refresh(); return; }
    rp.playing=true;
    // event by event: a real-time replay of a 40-minute session is 40 minutes
    rp.timer=setInterval(()=>{
      const nxt=(s.events||[]).find(e=>e.at>rp.t);
      if(!nxt){ stopPlay(s.sessionId); rp.t=b; refresh(); return; }
      rp.t=nxt.at; refresh();
    },850);
    refresh();
  };
  box.appendChild(bar);

  // where the events sit in the session, so pauses are visible as gaps
  const track=document.createElement('div');
  track.className='track';
  (s.events||[]).forEach(e=>{
    const tick=document.createElement('i');
    tick.style.left=((e.at-a)/span*100)+'%';
    tick.style.background=e.kind==='prompt'?'#5ad19a':
      e.kind==='create'?'#6b7a90':
      e.kind==='status:completed'?'#22c55e':
      e.kind==='status:abandoned'?'#3a4150':'#3b82f6';
    tick.style.opacity=e.at<=rp.t?'.95':'.25';
    tick.title=clock(e.at)+' — '+(EVK[e.kind]||e.kind);
    track.appendChild(tick);
  });
  box.appendChild(track);

  const line=document.createElement('div');
  line.className='evline';
  if(ev){
    const idx=(s.events||[]).indexOf(ev);
    const nxt=(s.events||[])[idx+1];
    line.innerHTML=(ev.kind==='prompt'
        ? `<b class="said">du sa:</b> ${esc(ev.text)}`
        : `<b>${EVK[ev.kind]||ev.kind}</b> ${ev.taskId?'#'+ev.taskId+' ':''}${esc(ev.text)}`)
      +`<span class="ghost">${idx+1}/${(s.events||[]).length}${nxt?' · neste: '+(EVK[nxt.kind]||nxt.kind)+' '+esc((nxt.text||'').slice(0,60)):' · slutt'}</span>`;
  } else line.innerHTML='<span class="ghost">før første hendelse</span>';
  if(behind){
    const note=document.createElement('span');
    note.className='ghost';
    note.style.color='#c9b6ef';
    note.textContent=`· dette er fortid — ${behind} hendelse${behind>1?'r':''} har skjedd siden`;
    line.appendChild(note);
  }
  box.appendChild(line);
  return box;
}

/* Codex records turns, not tasks. Drawing the turns as a graph would be a
   list wearing a graph's clothes, so they get a band along time instead. */
function turnStrip(s, until){
  const box=document.createElement('div');
  const turns=(s.turns||[]).filter(t=>!t.startedMs||t.startedMs<=until);
  if(!turns.length){
    box.innerHTML='<div class="why">ingen turer før dette punktet</div>';
    return box;
  }
  const strip=document.createElement('div'); strip.className='turns';
  const longest=Math.max(...turns.map(t=>t.durationMs||0),1);
  turns.forEach(t=>{
    const seg=document.createElement('i');
    seg.className='tn-'+(t.status||'completed');
    seg.style.flexGrow=String(Math.max(0.15,(t.durationMs||0)/longest));
    seg.addEventListener('mousemove',e=>{
      const files=(t.files||[]).length?`<div class="row">rørte ${esc([...new Set(t.files)].join(', '))}</div>`:'';
      const bad=(t.failures||[]).length?`<div class="row" style="color:#f0a8a8">feilet: ${esc(t.failures[0])}</div>`:'';
      showTip(e,`<h4>tur · ${LABEL[t.status]||t.status}</h4>
        <div style="color:var(--dim);font-size:11px">${t.durationMs!=null?dur(t.durationMs):'—'}${t.startedMs?' · '+clock(t.startedMs):''}</div>${files}${bad}`,seg);
    });
    seg.addEventListener('mouseleave',hideTip);
    strip.appendChild(seg);
  });
  box.appendChild(strip);
  const done=turns.filter(t=>t.status==='completed').length;
  const note=document.createElement('div');
  note.className='why';
  note.textContent=`${turns.length} turer, ${done} fullført — Codex fører ingen oppgaveliste, så det er ingen graf å tegne`;
  box.appendChild(note);
  return box;
}

function renderSession(s){
  const rp=REPLAY.get(s.sessionId);
  const goals=rp?stateAt(s,rp.t):s.goals;
  const el=document.createElement('section');
  // an idle session with nothing to draw folds itself away until asked for.
  // Codex sessions never have goals, so turns count as something to draw --
  // otherwise every finished Codex thread would hide its own content.
  const empty=!goals.length&&!(s.turns||[]).length&&!s.active;
  const shut=collapsed.has(s.sessionId)||(empty&&!opened.has(s.sessionId));
  el.className='sess'+(s.active?'':' idle')+(shut?' closed':'')+(rp?' frozen':'');

  const head=document.createElement('div');
  head.className='shead';
  const state=s.active?'<span class="pill on">aktiv</span>':
    (s.alive?`<span class="pill">stille ${ago(s.quietSeconds)}</span>`:'<span class="pill">avsluttet</span>');
  head.innerHTML=`<span class="caret">▾</span>${state}
    ${s.kind==='bg'?'<span class="pill bg">bakgrunn</span>':''}
    <span class="sname">${esc(s.name||s.firstPrompt||'(uten navn)')}</span>
    <span class="spath">${esc(s.project)}${s.branch?' · '+esc(s.branch):''}</span>
    <span style="flex:1"></span>
    ${s.attention==='waiting'?'<span class="att waiting">venter på deg</span>':''}
    ${s.attention==='stalled'?'<span class="att stalled">står stille</span>':''}
    <span class="agent ${s.agent||'claude'}">${s.agent||'claude'}</span>
    ${(s.events&&s.events.length>1)?`<button class="rbtn${rp?' on':''}">⏱ replay</button>`:''}`;
  const rbtn=head.querySelector('.rbtn');
  if(rbtn) rbtn.onclick=e=>{
    e.stopPropagation();
    if(REPLAY.has(s.sessionId)){ stopPlay(s.sessionId); REPLAY.delete(s.sessionId); }
    else REPLAY.set(s.sessionId,{t:s.spanStart,playing:false});
    el.classList.remove('closed'); collapsed.delete(s.sessionId); opened.add(s.sessionId);
    refresh();
  };
  head.onclick=()=>{
    el.classList.toggle('closed');
    if(el.classList.contains('closed')){collapsed.add(s.sessionId);opened.delete(s.sessionId);}
    else{collapsed.delete(s.sessionId);opened.add(s.sessionId);}
    localStorage.setItem('st.collapsed',JSON.stringify([...collapsed]));
    localStorage.setItem('st.opened',JSON.stringify([...opened]));
  };
  el.appendChild(head);

  const body=document.createElement('div');
  body.className='sbody';

  if(rp) body.appendChild(replayPanel(s,rp));
  if((s.agents||[]).length){
    const run=s.agents.filter(a=>a.running).length;
    const row=document.createElement('div');
    row.className='agentrow';
    row.innerHTML=`<b>${s.agents.length} agenter</b>${run?` · <span class="run">${run} kjører</span>`:''}`
      +` — startet før arbeidet ble delt opp, så de hører til økta<br>`
      +s.agents.slice(0,8).map(a=>`${a.running?'◐':'●'} ${esc(a.description)}`).join(' · ')
      +(s.agents.length>8?` · +${s.agents.length-8}`:'');
    body.appendChild(row);
  }
  const all=goals.flatMap(g=>g.nodes);
  const running=all.find(n=>n.view==='in_progress');
  const stalled=all.find(n=>n.view==='stalled');
  const blocked=all.find(n=>n.view==='blocked');
  const now=document.createElement('div');
  if(running){ now.className='now';
    now.innerHTML=`▶ <b>#${running.id}</b> ${esc(running.subject)}${running.durationMs!=null?` <span style="color:var(--faint)">· ${dur(running.durationMs)}</span>`:''}`; }
  else if(blocked){ now.className='now stall';
    now.innerHTML=`⏸ <b>#${blocked.id}</b> ${esc(blocked.subject)} — blokkert av #${(blocked.waitingOn||[]).join(', #')}`; }
  else if(stalled){ now.className='now stall';
    now.innerHTML=`⚠ <b>#${stalled.id}</b> ${esc(stalled.subject)} — ingen aktivitet på ${ago(s.quietSeconds)}`; }
  else if((s.turns||[]).length){
    const run=(s.turns||[]).find(t=>t.status==='in_progress');
    const fail=(s.turns||[]).filter(t=>t.status==='failed').length;
    now.className=run?'now':(fail?'now stall':'now none');
    now.innerHTML=run?`▶ tur pågår${run.durationMs!=null?` · ${dur(run.durationMs)}`:''}`
      :(fail?`⚠ ${fail} tur${fail>1?'er':''} feilet`:`${s.turns.length} turer, ingen pågår`);
  }
  else { now.className='now none';
    now.textContent=all.length?'ingen node under arbeid':'ingen oppgavegraf i denne økta';}
  body.appendChild(now);

  if(!goals.length && (s.turns||[]).length){
    body.appendChild(turnStrip(s, rp?rp.t:Infinity));
  }
  if(goals.length){
    // several independent goals are pages, not a wall: one decomposition at a
    // time, unless the viewer asks for all of them
    const paged=goals.length>1&&!pagerAll;
    const page=pageOf(s,goals.length);
    if(goals.length>1) body.appendChild(pagerBar(s,goals,page));
    const wrap=document.createElement('div'); wrap.className='goals'+(paged?' paged':'');
    (paged?[goals[page]]:goals).forEach(g=>{
      const live=g.nodes.filter(n=>n.view!=='abandoned');
      const done=live.filter(n=>n.view==='completed').length;
      const card=document.createElement('div'); card.className='goal';
      card.innerHTML=`<div class="gtitle">${esc(g.title)}</div>
        <div class="gmeta">${done}/${live.length} ferdig${g.nodes.length>live.length?` · ${g.nodes.length-live.length} forkastet`:''}</div>
        <div class="bar"><b style="width:${live.length?done/live.length*100:0}%"></b></div>
        ${(g.danglingEdges||[]).length?`<div class="broken">⚠ peker på steg som ikke finnes: ${esc(g.danglingEdges.join(', '))}</div>`:''}
        ${(g.hasEdges===false)?`<div class="why">ingen avhengigheter mellom disse — rekkefølgen er listerekkefølgen, ikke noe som venter på noe</div>`:''}`;
      card.querySelector('.gtitle').onclick=()=>openFocus(g,s);
      wrap.appendChild(card);
      PENDING.push({card:card,goal:g,sess:s});
    });
    if(paged) wireSwipe(wrap,s.sessionId,goals.length);
    body.appendChild(wrap);
  }
  el.appendChild(body);
  return el;
}

/* The pager: previous, dots, "2 / 4", next, and a switch to see every goal
   at once. A tap on a dot goes straight to that goal. */
function pagerBar(s,goals,page){
  const bar=document.createElement('div'); bar.className='pager';
  bar.innerHTML=`<button title="forrige mål">‹</button><span class="dots"></span><span class="n">${page+1} / ${goals.length}</span>
    <button title="neste mål">›</button><span class="ptitle">${pagerAll?'':esc(goals[page].title)}</span>
    <button class="all${pagerAll?' on':''}" title="alle målene på én gang">alle</button>`;
  const [prev,,,next]=bar.children;
  prev.onclick=()=>turnPage(s.sessionId,-1,goals.length);
  next.onclick=()=>turnPage(s.sessionId,1,goals.length);
  const dots=bar.querySelector('.dots');
  goals.forEach((g,i)=>{
    const d=document.createElement('i'); if(i===page) d.className='on'; d.title=g.title;
    d.onclick=()=>{ PAGE[s.sessionId]=i; remember('st.page',JSON.stringify(PAGE)); refresh(); };
    dots.appendChild(d);
  });
  bar.querySelector('.all').onclick=()=>{ pagerAll=!pagerAll; remember('st.pagerAll',pagerAll?'1':'0'); refresh(); };
  return bar;
}
/* A horizontal swipe on the paged goals turns the page; a vertical one is the
   page scrolling, which touch-action:pan-y leaves to the browser. */
function wireSwipe(el,sessionId,count){
  let from=null;
  el.addEventListener('pointerdown',e=>{ if(e.pointerType==='mouse'&&e.button!==0) return; from={x:e.clientX,y:e.clientY}; });
  el.addEventListener('pointerup',e=>{
    if(!from) return;
    const dx=e.clientX-from.x, dy=e.clientY-from.y; from=null;
    if(Math.abs(dx)>=SWIPE_PX&&Math.abs(dx)>Math.abs(dy)) turnPage(sessionId,dx<0?1:-1,count);
  });
  el.addEventListener('pointercancel',()=>{ from=null; });
}
addEventListener('keydown',e=>{
  if(FOCUS.open||e.target.matches('input,textarea,button')) return;
  if(e.key!=='ArrowLeft'&&e.key!=='ArrowRight') return;
  // the arrows turn the first open pager on the page
  const bar=document.querySelector('.sess:not(.closed) .pager'); if(!bar||!LAST) return;
  const el=bar.closest('.sess'), idx=[...document.querySelectorAll('.sess')].indexOf(el);
  const s=LAST.sessions[idx]; if(!s) return;
  const rp=REPLAY.get(s.sessionId), count=(rp?stateAt(s,rp.t):s.goals).length;
  if(count>1){ e.preventDefault(); turnPage(s.sessionId,e.key==='ArrowRight'?1:-1,count); }
});

function refresh(){ if(LAST) render(LAST); }

/* One graph on its own. The same renderGoal draws it, at the window's width,
   and the viewBox is what zooms and pans -- the drawing itself never changes,
   so tooltips and highlighting work exactly as in the card. FOCUS remembers
   which goal and where the eye is, so a live update redraws in place. */
const FOCUS={open:false,sessionId:null,title:null,view:null,base:null};
const fbox=()=>document.getElementById('fbody');
function fitFocus(){ FOCUS.view=FOCUS.base?{...FOCUS.base}:null; applyView(); }
function applyView(){
  const svg=fbox().querySelector('svg'); if(!svg||!FOCUS.view) return;
  const v=FOCUS.view; svg.setAttribute('viewBox',`${v.x} ${v.y} ${v.w} ${v.h}`);
}
function drawFocus(){
  if(!FOCUS.open||!LAST) return;
  const sess=LAST.sessions.find(x=>x.sessionId===FOCUS.sessionId);
  const rp=sess&&REPLAY.get(sess.sessionId);
  const goals=sess?(rp?stateAt(sess,rp.t):sess.goals):[];
  const goal=goals.find(g=>g.title===FOCUS.title);
  if(!goal){ closeFocus(); return; }
  const body=fbox(); body.innerHTML='';
  const svg=renderGoal(goal,sess,body.clientWidth-40,SIZE.large);
  svg.removeAttribute('height');
  body.appendChild(svg);
  // the drawing's own frame, padded, is what "fit" means; keep the aspect of the window
  const vb=svg.getAttribute('viewBox').split(' ').map(Number);
  const W=vb[2]+40, H=vb[3]+40, ar=body.clientWidth/Math.max(1,body.clientHeight);
  let w=W, h=H; if(w/h<ar) w=h*ar; else h=w/ar;
  FOCUS.base={x:vb[0]-20-(w-W)/2,y:vb[1]-20-(h-H)/2,w:w,h:h};
  if(!FOCUS.view) FOCUS.view=firstView(svg,goal,vb);
  applyView();
  const live=goal.nodes.filter(n=>n.view!=='abandoned');
  document.getElementById('ftitle').textContent=`${goal.title} — ${live.filter(n=>n.view==='completed').length}/${live.length} ferdig · ${sess.project}`;
}
/* Fitting a wide graph onto a phone shrinks its text past reading, which is
   what the focus exists to avoid. So it opens fitted only when fitting keeps
   the text near full size; otherwise at full size, from the top, centred on
   the node being worked on (or the first one still open), and the viewer pans. */
const READABLE_SCALE=0.8;
function firstView(svg,goal,vb){
  const body=fbox(), bw=body.clientWidth, bh=body.clientHeight;
  if(bw/FOCUS.base.w>=READABLE_SCALE) return {...FOCUS.base};
  const open=goal.nodes.find(n=>['in_progress','blocked','stalled'].includes(n.view))
    ||goal.nodes.find(n=>n.view!=='completed'&&n.view!=='abandoned')||goal.nodes[0];
  const box=open&&svg.querySelector(`.node[data-id="${CSS.escape(open.id)}"] rect`);
  const cx=box?+box.getAttribute('x')+(+box.getAttribute('width'))/2:vb[0]+vb[2]/2;
  const cy=box?+box.getAttribute('y'):vb[1];
  const x=Math.max(vb[0]-20,Math.min(cx-bw/2,vb[0]+vb[2]+20-bw));
  // the top of the graph when the node is on the first screen, else the node a third down
  const y=cy+80<vb[1]+bh?vb[1]-20:Math.min(cy-bh/3,vb[1]+vb[3]+20-bh);
  return {x:x,y:y,w:bw,h:bh};
}
function openFocus(goal,sess){
  FOCUS.open=true; FOCUS.sessionId=sess.sessionId; FOCUS.title=goal.title; FOCUS.view=null; FOCUS.base=null;
  document.getElementById('focus').classList.add('on');
  drawFocus();
}
function closeFocus(){
  FOCUS.open=false; document.getElementById('focus').classList.remove('on'); fbox().innerHTML=''; hideTip();
}
(function wireFocus(){
  const body=fbox();
  document.getElementById('fclose').onclick=closeFocus;
  document.getElementById('ffit').onclick=fitFocus;
  addEventListener('keydown',e=>{ if(e.key==='Escape'&&FOCUS.open) closeFocus(); });
  body.addEventListener('wheel',e=>{
    if(!FOCUS.view) return; e.preventDefault();
    const v=FOCUS.view, r=body.getBoundingClientRect();
    const px=v.x+(e.clientX-r.left)/r.width*v.w, py=v.y+(e.clientY-r.top)/r.height*v.h;
    const k=Math.exp(e.deltaY*0.0015);            // wheel down = out, wheel up = in
    const nw=Math.min(FOCUS.base.w*8,Math.max(FOCUS.base.w/40,v.w*k)), nh=nw*(v.h/v.w);
    FOCUS.view={x:px-(px-v.x)*(nw/v.w),y:py-(py-v.y)*(nh/v.h),w:nw,h:nh};
    applyView();
  },{passive:false});
  // one pointer drags; two pinch: the view scales by the change in the
  // distance between the fingers, about their midpoint. A second tap within
  // 300 ms fits the graph, for the touch screens that send no dblclick.
  const pointers=new Map();
  let drag=null, pinch=null, lastTap=0;
  const zoomAt=(px,py,k,from)=>{
    const nw=Math.min(FOCUS.base.w*8,Math.max(FOCUS.base.w/40,from.w*k)), nh=nw*(from.h/from.w);
    FOCUS.view={x:px-(px-from.x)*(nw/from.w),y:py-(py-from.y)*(nh/from.h),w:nw,h:nh};
    applyView();
  };
  body.addEventListener('pointerdown',e=>{
    if(!FOCUS.view||(e.pointerType==='mouse'&&e.button!==0)) return;
    pointers.set(e.pointerId,{x:e.clientX,y:e.clientY}); body.setPointerCapture(e.pointerId);
    if(pointers.size===2){
      const [a,b]=[...pointers.values()];
      pinch={d:Math.hypot(a.x-b.x,a.y-b.y),mx:(a.x+b.x)/2,my:(a.y+b.y)/2,v:{...FOCUS.view}}; drag=null;
    } else { drag={x:e.clientX,y:e.clientY,v:{...FOCUS.view}}; body.classList.add('dragging'); }
  });
  body.addEventListener('pointermove',e=>{
    if(!pointers.has(e.pointerId)) return;
    pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
    const r=body.getBoundingClientRect();
    if(pinch&&pointers.size===2){
      const [a,b]=[...pointers.values()], d=Math.hypot(a.x-b.x,a.y-b.y); if(d<1) return;
      const px=pinch.v.x+(pinch.mx-r.left)/r.width*pinch.v.w, py=pinch.v.y+(pinch.my-r.top)/r.height*pinch.v.h;
      zoomAt(px,py,pinch.d/d,pinch.v);
      return;
    }
    if(!drag) return;
    FOCUS.view={...drag.v,x:drag.v.x-(e.clientX-drag.x)/r.width*drag.v.w,y:drag.v.y-(e.clientY-drag.y)/r.height*drag.v.h};
    applyView();
  });
  const stop=e=>{
    pointers.delete(e.pointerId);
    if(pointers.size<2) pinch=null;
    if(!pointers.size){
      const moved=drag&&Math.hypot(e.clientX-drag.x,e.clientY-drag.y)>6;
      drag=null; body.classList.remove('dragging');
      if(e.pointerType!=='mouse'&&!moved){ const now=Date.now(); if(now-lastTap<300) fitFocus(); lastTap=now; }
    }
  };
  body.addEventListener('pointerup',stop); body.addEventListener('pointercancel',stop);
  body.addEventListener('dblclick',fitFocus);
})();

function render(data){
  LAST=data;
  // ?rp=<0..1> opens replay on the first active session at that point of its
  // span -- for screenshots, and for linking someone to a moment.
  const q=new URLSearchParams(location.search);
  if(q.has('rp')&&!REPLAY.size){
    const s0=data.sessions.find(x=>x.active&&x.events&&x.events.length>1);
    if(s0) REPLAY.set(s0.sessionId,
      {t:s0.spanStart+(s0.spanEnd-s0.spanStart)*parseFloat(q.get('rp')||'0.5'),playing:false});
  }
  const root=document.getElementById('root');
  const keep=window.scrollY;
  root.innerHTML='';
  if(!data.sessions.length){
    root.innerHTML='<div class="empty">ingen økter funnet</div>'; return;
  }
  PENDING.length=0;
  data.sessions.forEach(s=>root.appendChild(renderSession(s)));
  // second pass: the cards are in the document now, so their width is real
  PENDING.forEach(p=>p.card.appendChild(renderGoal(p.goal,p.sess,p.card.clientWidth-22,SIZE.card)));
  PENDING.length=0;
  window.scrollTo(0,keep);
  if(FOCUS.open) drawFocus();
  rehover();
}

let es;
/* ?once=1 renders a single snapshot and opens no stream -- for screenshots and
   for anything that waits for the page to finish loading. */
if(new URLSearchParams(location.search).has('once')){
  fetch('/api/state').then(r=>r.json()).then(d=>{
    render(d);
    document.getElementById('dot').classList.add('off');
    document.getElementById('conn').textContent='stillbilde';
  });
}else connect();

function connect(){
  es=new EventSource('/events');
  es.onopen=()=>{document.getElementById('dot').classList.remove('off');
                 document.getElementById('conn').textContent='live';};
  es.onmessage=e=>{ try{render(JSON.parse(e.data));}catch(err){console.error(err);} };
  es.onerror=()=>{ document.getElementById('dot').classList.add('off');
                   document.getElementById('conn').textContent='frakoblet – kobler til igjen…';
                   es.close(); setTimeout(connect,2000); };
}
addEventListener('resize',()=>{ fetch('/api/state').then(r=>r.json()).then(render); });
</script>
</body>
